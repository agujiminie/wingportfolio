<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CurieTech AI - Invited Review</title>
<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #f6f6f7;
  }
  iframe {
    display: block;
    width: 100vw;
    height: 100vh;
    border: 0;
    background: #f6f6f7;
  }
</style>
</head>
<body>
  <iframe id="inviteeFrame" title="Invited reviewer collaboration context"></iframe>
  <script>
    // Demo sync note: open both owner/reviewer pages from http://localhost so localStorage sync works.
    const params = new URLSearchParams(window.location.search);
    const context = params.get('context') === 'code' ? 'code' : 'design';
    document.getElementById('inviteeFrame').src = `automation-workflows-prototype-v2.html?invitee=${context}`;
  </script>
</body>
</html>
